<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Age Holidays Engine</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d26;
            --surface-hover: #232734;
            --text: #f0f2f8;
            --subtext: #94a3b8;
            --accent: #00ffcc;
            --accent-dim: rgba(0, 255, 204, 0.15);
            --border: #2e3444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--subtext);
            font-size: 1rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            flex: 1;
            min-width: 220px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="datetime-local"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #111319;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="datetime-local"]:focus, select:focus {
            border-color: var(--accent);
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #111319;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: none;
            letter-spacing: normal;
            font-weight: normal;
            transition: background 0.2s;
        }

        .checkbox-label:hover {
            background: var(--surface-hover);
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .filter-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
            padding: 0;
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            background: var(--accent);
            color: #000;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background: #00ddb0;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .holiday-list {
            list-style: none;
        }

        .holiday-item {
            background: var(--surface);
            border: 1px solid var(--border);
            margin-bottom: 0.8rem;
            padding: 1rem 1.25rem;
            border-left: 5px solid var(--accent);
            border-radius: 0 8px 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .holiday-item:hover {
            transform: translateX(4px);
            border-color: var(--accent);
        }

        .holiday-info {
            flex: 1;
        }

        .holiday-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .holiday-tag {
            display: inline-block;
            font-size: 0.75rem;
            background: var(--accent-dim);
            color: var(--accent);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 0.3rem;
            text-transform: uppercase;
        }

        .holiday-date-box {
            text-align: right;
            min-width: 160px;
        }

        .holiday-date {
            color: var(--accent);
            font-weight: 700;
            font-size: 1rem;
        }

        .holiday-relative {
            font-size: 0.85rem;
            color: var(--subtext);
        }

        @media (max-width: 600px) {
            .holiday-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .holiday-date-box {
                text-align: left;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cool Age Holidays</h1>
        <p class="subtitle">Dense, meaningful age milestones calculated for your lifetime</p>
    </header>

    <div class="card">
        <div class="form-row">
            <div class="form-group">
                <label for="birthdate">Birth Date & Time</label>
                <input type="datetime-local" id="birthdate">
            </div>
            <div class="form-group">
                <label for="max-results">Max Holidays to Show</label>
                <select id="max-results">
                    <option value="10">10 Holidays</option>
                    <option value="25">25 Holidays</option>
                    <option value="50">50 Holidays</option>
                    <option value="100" selected>100 Holidays (~6 Months)</option>
                    <option value="200">200 Holidays (~1 Year)</option>
                </select>
            </div>
        </div>

        <div class="filter-controls">
            <label>Active Metric Categories</label>
            <div>
                <button type="button" class="btn-text" onclick="toggleCategories(true)">Select All</button> | 
                <button type="button" class="btn-text" onclick="toggleCategories(false)">Deselect All</button>
            </div>
        </div>

        <div class="categories-grid">
            <label class="checkbox-label">
                <input type="checkbox" class="cat-checkbox" value="standard" checked>
                Standard Time (Days, Weeks, Months, Hours)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="cat-checkbox" value="lunar" checked>
                Lunar & Moons (Full Moons Lived)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="cat-checkbox" value="si" checked>
                SI Time (Kiloseconds & Megaseconds)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="cat-checkbox" value="nature" checked>
                Pets & Body (Dog/Cat Years, Sleep Cycles)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="cat-checkbox" value="cosmic" checked>
                Planetary Orbits (Mars, Venus, Mercury)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" class="cat-checkbox" value="historical" checked>
                Historical (Olympiads & Jubilees)
            </label>
        </div>

        <button type="button" class="btn-primary" onclick="calculateHolidays()">Find My Holidays</button>
    </div>

    <div id="results" style="display: none;">
        <div class="results-header">
            <h2>Upcoming Holidays</h2>
            <span id="results-count" class="subtitle"></span>
        </div>
        <ul class="holiday-list" id="upcoming-list"></ul>
    </div>

<script>
// --- TIME CONSTANTS ---
const msPerSecond = 1000;
const msPerMinute = msPerSecond * 60;
const msPerHour = msPerMinute * 60;
const msPerDay = msPerHour * 24;
const msPerWeek = msPerDay * 7;
const msPerYear = msPerDay * 365.2425;
const msPerLunarCycle = msPerDay * 29.53059; // Synodic Month

// --- HELPER MATHEMATICAL DETECTORS ---
function isRepdigit(n) {
    if (n < 10) return false;
    let s = Math.floor(n).toString();
    return s.split('').every(c => c === s[0]);
}

function isPalindrome(n) {
    if (n < 100) return false;
    let s = Math.floor(n).toString();
    return s === s.split('').reverse().join('');
}

function isPowerOf2(n) {
    return n > 0 && (n & (n - 1)) === 0;
}

function isFibonacci(n) {
    if (n < 5) return false;
    let isSquare = x => Math.sqrt(x) % 1 === 0;
    return isSquare(5 * n * n + 4) || isSquare(5 * n * n - 4);
}

// --- DENSE METRIC DEFINITIONS WITH SPECIFIC STEPPING ---
const Metrics = [
    // Standard Time
    {
        name: "Days",
        ms: msPerDay,
        category: "standard",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current) + 1;
            for (let d = start; d <= start + 400; d++) {
                if (d % 25 === 0) list.push({ val: d, label: "25-Day Interval" });
                else if (isRepdigit(d)) list.push({ val: d, label: "Repdigit Days" });
                else if (isPalindrome(d)) list.push({ val: d, label: "Palindrome Days" });
                else if (isPowerOf2(d)) list.push({ val: d, label: "Power of 2 Days" });
                else if (isFibonacci(d)) list.push({ val: d, label: "Fibonacci Days" });
            }
            return list;
        }
    },
    {
        name: "Weeks",
        ms: msPerWeek,
        category: "standard",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current) + 1;
            for (let w = start; w <= start + 60; w++) {
                if (w % 5 === 0) list.push({ val: w, label: "5-Week Interval" });
                else if (isRepdigit(w)) list.push({ val: w, label: "Repdigit Weeks" });
                else if (isPalindrome(w)) list.push({ val: w, label: "Palindrome Weeks" });
            }
            return list;
        }
    },
    {
        name: "Fortnights",
        ms: msPerDay * 14,
        category: "standard",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current) + 1;
            for (let f = start; f <= start + 30; f++) {
                if (f % 5 === 0 || isRepdigit(f) || isPalindrome(f)) {
                    list.push({ val: f, label: "Fortnight Milestone" });
                }
            }
            return list;
        }
    },
    {
        name: "Hours",
        ms: msPerHour,
        category: "standard",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current / 500) * 500 + 500;
            for (let h = start; h <= start + 10000; h += 500) {
                let label = (h % 5000 === 0) ? "5,000 Hour Milestone" : "500 Hour Milestone";
                list.push({ val: h, label: label });
            }
            return list;
        }
    },

    // Lunar & Moons
    {
        name: "Full Moons Lived",
        ms: msPerLunarCycle,
        category: "lunar",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current) + 1;
            for (let m = start; m <= start + 20; m++) {
                let label = (m % 10 === 0) ? "Decade Moon Milestone" : "Lunar Cycle";
                list.push({ val: m, label: label });
            }
            return list;
        }
    },

    // SI Units
    {
        name: "Kiloseconds (ks)",
        ms: msPerSecond * 1000,
        category: "si",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current / 2500) * 2500 + 2500;
            for (let ks = start; ks <= start + 50000; ks += 2500) {
                let label = (ks % 10000 === 0) ? "10,000 ks Milestone" : "2,500 ks Interval";
                list.push({ val: ks, label: label });
            }
            return list;
        }
    },
    {
        name: "Megaseconds (Ms)",
        ms: msPerSecond * 1000000,
        category: "si",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current / 5) * 5 + 5;
            for (let ms = start; ms <= start + 100; ms += 5) {
                let label = (ms % 25 === 0) ? "25 Ms Milestone" : "5 Ms Step";
                list.push({ val: ms, label: label });
            }
            return list;
        }
    },

    // Bio & Pets
    {
        name: "Dog Years",
        ms: msPerYear / 7,
        category: "nature",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current * 4) + 1;
            for (let q = start; q <= start + 30; q++) {
                let val = q / 4;
                if (val % 1 === 0 || val % 0.5 === 0) {
                    list.push({ val: val, label: "Dog Year Milestone" });
                }
            }
            return list;
        }
    },
    {
        name: "Cat Years",
        ms: msPerYear / 6,
        category: "nature",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current * 2) + 1;
            for (let h = start; h <= start + 20; h++) {
                let val = h / 2;
                list.push({ val: val, label: "Cat Year Milestone" });
            }
            return list;
        }
    },
    {
        name: "Sleep Cycles (~90m)",
        ms: msPerMinute * 90,
        category: "nature",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current / 250) * 250 + 250;
            for (let sc = start; sc <= start + 3000; sc += 250) {
                list.push({ val: sc, label: "250 Sleep Cycles" });
            }
            return list;
        }
    },

    // Cosmic & Planetary
    {
        name: "Mars Years",
        ms: msPerDay * 686.98,
        category: "cosmic",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current * 10) + 1;
            for (let step = start; step <= start + 20; step++) {
                let val = step / 10; // Every 0.1 Mars Years
                list.push({ val: val, label: "Mars Orbit Step" });
            }
            return list;
        }
    },
    {
        name: "Venus Years",
        ms: msPerDay * 224.7,
        category: "cosmic",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current * 4) + 1;
            for (let step = start; step <= start + 20; step++) {
                let val = step / 4; // Every 0.25 Venus Years
                list.push({ val: val, label: "Venus Orbit Quarter" });
            }
            return list;
        }
    },
    {
        name: "Mercury Years",
        ms: msPerDay * 87.97,
        category: "cosmic",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current * 2) + 1;
            for (let step = start; step <= start + 20; step++) {
                let val = step / 2; // Every 0.5 Mercury Years
                list.push({ val: val, label: "Mercury Half-Orbit" });
            }
            return list;
        }
    },

    // Historical & Cultural
    {
        name: "Olympiads (4-Yr)",
        ms: msPerYear * 4,
        category: "historical",
        getMilestones: (current) => {
            let list = [];
            let start = Math.floor(current * 10) + 1;
            for (let step = start; step <= start + 10; step++) {
                let val = step / 10; // Every 0.1 Olympiads
                list.push({ val: val, label: "Olympiad Fractional" });
            }
            return list;
        }
    }
];

// --- UI HELPER FUNCTIONS ---
function toggleCategories(selectState) {
    document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = selectState);
}

function formatRelativeTime(targetMs, nowMs) {
    const diffMs = targetMs - nowMs;
    const diffDays = Math.floor(diffMs / msPerDay);
    
    if (diffDays === 0) return "Today!";
    if (diffDays === 1) return "Tomorrow";
    if (diffDays < 30) return `In ${diffDays} days`;
    if (diffDays < 365) return `In ${(diffDays / 30).toFixed(1)} months`;
    return `In ${(diffDays / 365.25).toFixed(1)} years`;
}

// Set default datetime picker to 20 years ago
window.addEventListener('DOMContentLoaded', () => {
    const defaultDate = new Date();
    defaultDate.setFullYear(defaultDate.getFullYear() - 20);
    document.getElementById('birthdate').value = defaultDate.toISOString().slice(0, 16);
});

// --- MAIN CALCULATION ENGINE ---
function calculateHolidays() {
    const birthInput = document.getElementById('birthdate').value;
    if (!birthInput) return alert("Please enter a birth date and time.");
    
    const birthDate = new Date(birthInput).getTime();
    const now = Date.now();
    
    if (birthDate > now) return alert("Birth date must be in the past!");

    const msLived = now - birthDate;
    const maxResults = parseInt(document.getElementById('max-results').value);

    const activeCategories = new Set(
        Array.from(document.querySelectorAll('.cat-checkbox:checked')).map(cb => cb.value)
    );

    if (activeCategories.size === 0) {
        return alert("Please select at least one metric category.");
    }

    let upcomingHolidays = [];
    const activeMetrics = Metrics.filter(m => activeCategories.has(m.category));

    activeMetrics.forEach(metric => {
        const currentVal = msLived / metric.ms;
        const targets = metric.getMilestones(currentVal);

        targets.forEach(t => {
            const targetTimestamp = birthDate + (t.val * metric.ms);
            
            if (targetTimestamp > now) {
                let formattedVal = Number.isInteger(t.val) ? t.val.toLocaleString() : t.val.toFixed(2);
                upcomingHolidays.push({
                    metricName: metric.name,
                    targetVal: t.val,
                    label: t.label,
                    description: `You will be exactly <b>${formattedVal}</b> ${metric.name} old!`,
                    timestamp: targetTimestamp
                });
            }
        });
    });

    // Sort chronologically
    upcomingHolidays.sort((a, b) => a.timestamp - b.timestamp);

    // Deduplicate events occurring within 12 hours of each other to maintain high variety
    let deduplicated = [];
    upcomingHolidays.forEach(h => {
        const isTooClose = deduplicated.some(existing => 
            Math.abs(existing.timestamp - h.timestamp) < (12 * msPerHour) &&
            existing.metricName === h.metricName
        );
        if (!isTooClose) deduplicated.push(h);
    });

    renderHolidays(deduplicated.slice(0, maxResults), now);
}

function renderHolidays(holidays, now) {
    const list = document.getElementById('upcoming-list');
    const countSpan = document.getElementById('results-count');
    list.innerHTML = "";
    
    countSpan.textContent = `Showing top ${holidays.length} upcoming events`;

    if (holidays.length === 0) {
        list.innerHTML = `<li class="holiday-item"><div class="holiday-info">No upcoming holidays found for selected categories.</div></li>`;
        document.getElementById('results').style.display = 'block';
        return;
    }

    holidays.forEach(h => {
        const li = document.createElement('li');
        li.className = 'holiday-item';
        
        const eventDate = new Date(h.timestamp);
        const dateStr = eventDate.toLocaleDateString(undefined, { 
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' 
        });
        const timeStr = eventDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const relativeStr = formatRelativeTime(h.timestamp, now);

        li.innerHTML = `
            <div class="holiday-info">
                <div class="holiday-title">${h.description}</div>
                <span class="holiday-tag">${h.label}</span>
            </div>
            <div class="holiday-date-box">
                <div class="holiday-date">${dateStr}</div>
                <div class="holiday-relative">${timeStr} • ${relativeStr}</div>
            </div>
        `;
        list.appendChild(li);
    });
    
    document.getElementById('results').style.display = 'block';
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Age Holidays | The Lifetime Math Engine</title>
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #1f2833;
            --surface-hover: #2b3644;
            --text: #c5c6c7;
            --text-bright: #ffffff;
            --accent: #66fcf1;
            --accent-dim: #45a29e;
            --border: #2c363f;
            
            /* Math Badges */
            --badge-tri: #b829ea;
            --badge-sq: #29ea46;
            --badge-fib: #eac529;
            --badge-pal: #29b8ea;
            --badge-pwr2: #ea6d29;
            --badge-round: #ea2950;
            --badge-rep: #29ead8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 950px;
            margin: 0 auto;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: var(--text-bright);
            font-size: 1.1rem;
        }

        .stats-box {
            background: linear-gradient(135deg, rgba(102, 252, 241, 0.1), rgba(69, 162, 158, 0.05));
            border: 1px solid var(--accent-dim);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: bold;
            color: var(--text-bright);
        }

        .stats-number {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            flex: 1;
            min-width: 250px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="datetime-local"], select {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1.05rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #151a22;
            color: var(--text-bright);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="datetime-local"]:focus, select:focus {
            border-color: var(--accent);
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #151a22;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .checkbox-label:hover { background: var(--surface-hover); }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 6px;
            background: var(--accent);
            color: #0b0c10;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, background-color 0.2s;
            margin-top: 1.5rem;
        }

        .btn-primary:hover { background: #85fdf5; }
        .btn-primary:active { transform: scale(0.98); }

        .holiday-list { list-style: none; }

        .holiday-item {
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 1rem;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            border-left: 4px solid var(--border);
            transition: transform 0.15s ease;
        }

        .holiday-item:hover {
            transform: translateX(5px);
            background: var(--surface-hover);
        }

        .holiday-info { flex: 1; }

        .holiday-title {
            font-size: 1.15rem;
            color: var(--text-bright);
            margin-bottom: 0.4rem;
        }

        .holiday-title b { color: var(--accent); }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .holiday-tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0b0c10;
        }

        .holiday-date-box {
            text-align: right;
            min-width: 180px;
        }

        .holiday-date {
            color: var(--text-bright);
            font-weight: 700;
            font-size: 1.05rem;
        }

        .holiday-relative {
            font-size: 0.85rem;
            color: var(--accent-dim);
            margin-top: 0.2rem;
        }

        /* Math Property Colors */
        .tag-triangular { background: var(--badge-tri); }
        .tag-square { background: var(--badge-sq); }
        .tag-cube { background: var(--badge-cube, var(--badge-sq)); }
        .tag-fibonacci { background: var(--badge-fib); }
        .tag-palindrome { background: var(--badge-pal); }
        .tag-power2 { background: var(--badge-pwr2); color: white;}
        .tag-round { background: var(--badge-round); color: white; }
        .tag-repdigit { background: var(--badge-rep); }
        .tag-constant { background: #fff; }

        @media (max-width: 600px) {
            .holiday-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .holiday-date-box {
                text-align: left;
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cool Age Holidays</h1>
        <p class="subtitle">The Universal Mathematical Lifetime Engine</p>
    </header>

    <div class="stats-box" id="stats-box" style="display: none;">
        Mathematical Proof: You have an estimated <span class="stats-number" id="lifetime-total">0</span> pure mathematical milestones between birth and age 120.<br>
        <span style="font-size: 0.9rem; font-weight: normal; color: var(--text);">That's roughly <span id="daily-avg" style="color: var(--accent);">0</span> mathematically perfect holidays every single day of your life.</span>
    </div>

    <div class="card">
        <div class="form-row">
            <div class="form-group">
                <label for="birthdate">Birth Date & Time</label>
                <input type="datetime-local" id="birthdate">
            </div>
            <div class="form-group">
                <label for="max-results">Upcoming Holidays to Generate</label>
                <select id="max-results">
                    <option value="50">Next 50</option>
                    <option value="100">Next 100</option>
                    <option value="250" selected>Next 250</option>
                    <option value="500">Next 500 (Massive Density)</option>
                    <option value="1000">Next 1,000 (Maximum Density)</option>
                </select>
            </div>
        </div>

        <label>Active Metrics Engine (Select What You Value)</label>
        <div class="categories-grid">
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Seconds" checked> Seconds</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Minutes" checked> Minutes</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Hours" checked> Hours</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Days" checked> Days</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Weeks" checked> Weeks</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Months" checked> Months</label>
            
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Heartbeats" checked> Heartbeats (avg 72bpm)</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Breaths" checked> Breaths (avg 15bpm)</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="SleepCycles" checked> Sleep Cycles (90m)</label>
            
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="DogYears" checked> Dog Years</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="CatYears" checked> Cat Years</label>
            
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="MoonCycles" checked> Lunar Cycles</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="MercuryYears"> Mercury Years</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="MarsYears" checked> Mars Years</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="JupiterYears"> Jupiter Years</label>
            
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Microcenturies" checked> Microcenturies</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="SwatchBeats"> Swatch Beats</label>
            <label class="checkbox-label"><input type="checkbox" class="metric-cb" value="Olympiads"> Olympiads</label>
        </div>

        <button type="button" class="btn-primary" onclick="generateHolidays()">Calculate My Math Destiny</button>
    </div>

    <div id="results" style="display: none;">
        <h2 style="color: var(--accent); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">Your Next Upcoming Holidays</h2>
        <ul class="holiday-list" id="upcoming-list"></ul>
    </div>

<script>
// --- CORE TIME CONSTANTS (in milliseconds) ---
const msPerSecond = 1000;
const msPerMinute = msPerSecond * 60;
const msPerHour = msPerMinute * 60;
const msPerDay = msPerHour * 24;
const msPerWeek = msPerDay * 7;
const msPerMonth = msPerDay * 30.4375;
const msPerYear = msPerDay * 365.2425;

const MetricsData = {
    "Seconds": msPerSecond,
    "Minutes": msPerMinute,
    "Hours": msPerHour,
    "Days": msPerDay,
    "Weeks": msPerWeek,
    "Months": msPerMonth,
    "Heartbeats": msPerMinute / 72, 
    "Breaths": msPerMinute / 15,
    "SleepCycles": msPerMinute * 90,
    "DogYears": msPerYear / 7,
    "CatYears": msPerYear / 6,
    "MoonCycles": msPerDay * 29.53059,
    "MercuryYears": msPerDay * 87.97,
    "MarsYears": msPerDay * 686.98,
    "JupiterYears": msPerDay * 4332.59,
    "Microcenturies": msPerMinute * 52.596,
    "SwatchBeats": msPerDay / 1000,
    "Olympiads": msPerYear * 4
};

// --- DIRECT MATH GENERATORS O(1) ---
// Instead of scanning every number, we mathematically generate the exact next valid integers.

function getMathMilestones(start, countPerProperty = 15) {
    let raw = [];
    if (start < 1) start = 1;

    // 1. Perfect Squares
    let sqBase = Math.ceil(Math.sqrt(start));
    for (let i = 0; i < countPerProperty; i++) raw.push({ val: Math.pow(sqBase + i, 2), tag: "PERFECT SQUARE", class: "tag-square" });

    // 2. Perfect Cubes
    let cbBase = Math.ceil(Math.cbrt(start));
    for (let i = 0; i < countPerProperty; i++) raw.push({ val: Math.pow(cbBase + i, 3), tag: "PERFECT CUBE", class: "tag-cube" });

    // 3. Triangular Numbers ( n(n+1)/2 )
    let triBase = Math.ceil((-1 + Math.sqrt(1 + 8 * start)) / 2);
    for (let i = 0; i < countPerProperty; i++) {
        let n = triBase + i;
        raw.push({ val: (n * (n + 1)) / 2, tag: "TRIANGULAR NUMBER", class: "tag-triangular" });
    }

    // 4. Powers of 2
    let p2Base = Math.max(1, Math.ceil(Math.log2(start)));
    for (let i = 0; i < countPerProperty; i++) raw.push({ val: Math.pow(2, p2Base + i), tag: "POWER OF 2", class: "tag-power2" });

    // 5. Fibonacci
    let a = 1, b = 1;
    let fibCount = 0;
    while (fibCount < countPerProperty && b < Number.MAX_SAFE_INTEGER) {
        let temp = a + b; a = b; b = temp;
        if (b >= start && b > 2) {
            raw.push({ val: b, tag: "FIBONACCI", class: "tag-fibonacci" });
            fibCount++;
        }
    }

    // 6. Clean Powers of 10 and Halves
    let sStr = start.toString();
    let mag = Math.max(1, Math.pow(10, sStr.length - 1));
    let rCount = 0;
    while(rCount < countPerProperty && mag < Number.MAX_SAFE_INTEGER) {
        for(let d = 1; d <= 9; d++) {
            let v = d * mag;
            if (v >= start && v >= 100) {
                raw.push({ val: v, tag: d === 1 ? "POWER OF 10" : "CLEAN ROUND", class: "tag-round" });
                rCount++;
            }
        }
        mag *= 10;
    }

    // 7. Repdigits
    let repCount = 0;
    let rLen = sStr.length;
    while (repCount < countPerProperty && rLen < 15) {
        for(let d = 1; d <= 9; d++) {
            let v = parseInt(d.toString().repeat(rLen));
            if (v >= start && v > 10) {
                raw.push({ val: v, tag: "REPDIGIT", class: "tag-repdigit" });
                repCount++;
            }
        }
        rLen++;
    }

    // 8. Palindromes (Generative approach)
    let pCount = 0;
    let pLen = sStr.length;
    while(pCount < countPerProperty && pLen < 15) {
        let halfLen = Math.ceil(pLen / 2);
        let minH = Math.pow(10, halfLen - 1);
        let maxH = Math.pow(10, halfLen) - 1;
        let startH = pLen === sStr.length ? parseInt(sStr.substring(0, halfLen)) : minH;
        
        for (let h = startH; h <= startH + countPerProperty && h <= maxH; h++) {
            let left = h.toString();
            let right = left.split('').reverse().join('');
            let pStr = pLen % 2 === 0 ? left + right : left + right.substring(1);
            let pVal = parseInt(pStr);
            if (pVal >= start && pVal > 100) {
                raw.push({ val: pVal, tag: "PALINDROME", class: "tag-palindrome" });
                pCount++;
            }
        }
        pLen++;
    }

    // 9. Constants (Pi, e, Golden Ratio, Memes)
    const constants = [
        {v: 314, l: "PI DIGITS"}, {v: 3141, l: "PI DIGITS"}, {v: 31415, l: "PI DIGITS"}, {v: 314159, l: "PI DIGITS"},
        {v: 1618, l: "GOLDEN RATIO"}, {v: 16180, l: "GOLDEN RATIO"}, {v: 161803, l: "GOLDEN RATIO"},
        {v: 2718, l: "EULER'S NUMBER"}, {v: 27182, l: "EULER'S NUMBER"},
        {v: 420, l: "MEME NUMBER"}, {v: 1337, l: "MEME NUMBER"}, {v: 42069, l: "MEME NUMBER"}
    ];
    constants.forEach(c => {
        if (c.v >= start) raw.push({ val: c.v, tag: c.l, class: "tag-constant" });
    });

    // Merge duplicate values to combine tags (e.g., Square + Palindrome)
    let map = new Map();
    raw.forEach(item => {
        if (!map.has(item.val)) {
            map.set(item.val, { val: item.val, tags: [ {text: item.tag, cls: item.class} ] });
        } else {
            // Add tag if not already present
            let existing = map.get(item.val);
            if (!existing.tags.some(t => t.text === item.tag)) {
                existing.tags.push({text: item.tag, cls: item.class});
            }
        }
    });

    return Array.from(map.values()).sort((a,b) => a.val - b.val);
}

// --- LIFETIME PROOF ESTIMATOR ---
function estimateLifetimeMilestones(activeMetrics) {
    let total = 0;
    const lifeMs = 120 * msPerYear; 
    
    activeMetrics.forEach(metricKey => {
        const maxValue = lifeMs / MetricsData[metricKey];
        if (maxValue < 1) return;
        
        total += Math.floor(Math.sqrt(maxValue)); // Squares
        total += Math.floor(Math.cbrt(maxValue)); // Cubes
        total += Math.floor(Math.sqrt(maxValue * 2)); // Triangulars
        total += Math.floor(Math.log2(maxValue)); // Pow 2
        total += Math.floor(Math.log(maxValue) / Math.log(1.618)); // Fib
        
        let digits = Math.floor(Math.log10(maxValue));
        if (digits > 0) {
            total += 9 * digits; // Rounds
            total += 9 * digits; // Repdigits
            
            // Palindromes
            for (let i = 1; i <= digits; i++) {
                total += 9 * Math.pow(10, Math.floor((i - 1) / 2));
            }
        }
    });
    return total;
}

// --- MAIN ENGINE ---
function generateHolidays() {
    const birthInput = document.getElementById('birthdate').value;
    if (!birthInput) return alert("Please enter your birth date & time.");
    
    const birthDate = new Date(birthInput).getTime();
    const now = Date.now();
    
    if (birthDate > now) return alert("Birth date must be in the past!");

    const activeMetrics = Array.from(document.querySelectorAll('.metric-cb:checked')).map(cb => cb.value);
    if (activeMetrics.length === 0) return alert("Select at least one metric.");

    const maxResults = parseInt(document.getElementById('max-results').value);
    const msLived = now - birthDate;

    // 1. Prove the density mathematically for the stats box
    const lifetimeCount = estimateLifetimeMilestones(activeMetrics);
    const dailyAvg = (lifetimeCount / (120 * 365.25)).toFixed(1);
    
    document.getElementById('lifetime-total').textContent = lifetimeCount.toLocaleString();
    document.getElementById('daily-avg').textContent = dailyAvg;
    document.getElementById('stats-box').style.display = 'block';

    // 2. Generate future milestones
    let allEvents = [];

    activeMetrics.forEach(metricKey => {
        const msPerUnit = MetricsData[metricKey];
        const currentValue = msLived / msPerUnit;
        const startInt = Math.floor(currentValue) + 1;
        
        // Get next 50 guaranteed math milestones for this specific metric
        const milestones = getMathMilestones(startInt, 50);
        
        milestones.forEach(m => {
            const eventTimestamp = birthDate + (m.val * msPerUnit);
            if (eventTimestamp > now) {
                allEvents.push({
                    metricName: metricKey.replace(/([A-Z])/g, ' $1').trim(), // CamelCase to space
                    val: m.val,
                    tags: m.tags,
                    timestamp: eventTimestamp
                });
            }
        });
    });

    // 3. Sort chronologically and take top results
    allEvents.sort((a, b) => a.timestamp - b.timestamp);
    const topEvents = allEvents.slice(0, maxResults);

    renderHolidays(topEvents, now);
}

function renderHolidays(holidays, now) {
    const list = document.getElementById('upcoming-list');
    list.innerHTML = "";

    holidays.forEach(h => {
        const li = document.createElement('li');
        li.className = 'holiday-item';
        
        const eventDate = new Date(h.timestamp);
        const dateStr = eventDate.toLocaleDateString(undefined, { 
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' 
        });
        const timeStr = eventDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const diffDays = Math.floor((h.timestamp - now) / msPerDay);
        let relativeStr = "Today!";
        if (diffDays === 1) relativeStr = "Tomorrow";
        else if (diffDays > 1) relativeStr = `In ${diffDays} days`;

        const tagsHtml = h.tags.map(t => `<span class="holiday-tag ${t.cls}">${t.text}</span>`).join('');

        li.innerHTML = `
            <div class="holiday-info">
                <div class="holiday-title">You will reach <b>${h.val.toLocaleString()}</b> ${h.metricName}!</div>
                <div class="tags-container">${tagsHtml}</div>
            </div>
            <div class="holiday-date-box">
                <div class="holiday-date">${dateStr}</div>
                <div class="holiday-relative">${timeStr} • ${relativeStr}</div>
            </div>
        `;
        list.appendChild(li);
    });
    
    document.getElementById('results').style.display = 'block';
}

// Set default birthdate
window.addEventListener('DOMContentLoaded', () => {
    const d = new Date();
    d.setFullYear(d.getFullYear() - 25); // Default to 25 years old
    document.getElementById('birthdate').value = d.toISOString().slice(0, 16);
});
</script>

</body>
</html>
